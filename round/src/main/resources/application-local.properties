#spring.application.name=round

#server.port=8000

spring.datasource.url=jdbc:postgresql://postgres_rounds:5432/rounds
spring.datasource.username=serviceuser
spring.datasource.password=servicepwd

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.datasource.driver-class-name=org.postgresql.Driver

deck.service.url=http://localhost:8100/api/deck/cards
#deck.service.url=http://deck:8001/api/deck/cards

logging.level.root=WARN
logging.level.org.hibernate=ERROR


spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.cloud.consul.host=consul
spring.cloud.consul.port=8500