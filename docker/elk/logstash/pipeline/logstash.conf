
input {
  #file {
  #  path => "/var/lib/docker/containers/*/*-json.log"
  #  start_position => "beginning"
  #  sincedb_path => "/usr/share/logstash/data/docker-sincedb"
  #  codec => json
  #}
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Docker json-file records contain the actual stdout
  # or stderr content in the "log" field.
  if [log] {
    mutate {
      rename => { "log" => "message" }
    }
  }

  # The Spring Boot application writes one ECS JSON
  # event per line.
  if [message] {
    json {
      source => "message"
      target => "app"
      skip_on_invalid_json => true
    }
  }

  if [app] {
    # Promote the useful application fields to the
    # top level for straightforward Kibana searches.
    if [app][@timestamp] {
      date {
        match => ["[app][@timestamp]", "ISO8601"]
        target => "@timestamp"
      }
    }

    if [app][message] {
      mutate {
        replace => { "message" => "%{[app][message]}" }
      }
    }

    if [app][log][level] {
      mutate {
        add_field => { "log_level" => "%{[app][log][level]}" }
      }
    }

    if [app][service][name] {
      mutate {
        add_field => { "service_name" => "%{[app][service][name]}" }
      }
    }

    if [app][service_instance] {
      mutate {
        add_field => {
          "service_instance" => "%{[app][service_instance]}"
        }
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "cards-logs-%{+YYYY.MM.dd}"
  }

  # Keep this during the classroom setup to inspect
  # the events that Logstash is actually processing.
  stdout {
    codec => rubydebug
  }
}
