spring:
  application:
    name: gateway
  config:
    import: "optional:consul:"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/mikro2026
  cloud:
    consul:
      host: consul
      port: 8500
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedHeaders:
                  - "*"
                allowedMethods:
                  - "GET"
                  - "POST"
                  - "PUT"
                  - "OPTIONS"
                allowCredentials: true
          routes:
            - id: deck
              uri: lb://deck
              predicates:
                - Path=/api/deck/cards/**
            - id: deck-secured
              uri: lb://deck
              predicates:
                - Path=/api/deck/secured/**

            - id: resolver-secured
              uri: lb://resolver
              predicates:
                - Path=/api/resolver/secured, /api/resolver/secured/**
            - id: resolver
              uri: lb://resolver
              predicates:
                - Path=/api/resolver/resolved, /api/resolver/resolved/**

            - id: round
              uri: lb://round
              predicates:
                - Path=/api/round, /api/round/**

server.port: 8100
management:
  endpoints:
    web:
      exposure:
        include: "health,info"