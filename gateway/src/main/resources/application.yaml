spring:
  application:
    name: gateway
  config:
    import: "optional:consul:"
  cloud:
    consul:
      host: consul
      port: 8500
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedHeaders:
                  - "*"
                allowedMethods:
                  - "GET"
                  - "POST"
                  - "PUT"
                  - "OPTIONS"
                allowCredentials: true
          routes:
            - id: deck
              uri: lb://deck
              predicates:
                - Path=/api/deck/**
            - id: resolver
              uri: lb://resolver
              predicates:
                - Path=/api/resolver/**
            - id: round
              uri: lb://round
              predicates:
                - Path=/api/round, /api/round/**


server.port: 8100
management:
  endpoints:
    web:
      exposure:
        include: "health,info"

















