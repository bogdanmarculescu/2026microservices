spring:
  application:
    name: gateway
  config:
    import: "optional:consul:"
  cloud:
    consul:
      host: consul
      port: 8500
    gateway:
      server:
        webflux:
          routes:
            - id: deck
              uri: lb://deck
              predicates:
                - Path=/api/deck/**



server.port: 8100
management:
  endpoints:
    web:
      exposure:
        include: "health,info"