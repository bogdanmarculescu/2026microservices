spring.application.name=resolver
server.port = 8006

# spring.profiles.active=default

spring.datasource.url=jdbc:postgresql://localhost:5433/resolver

# spring.datasource.url=jdbc:postgresql://postgres:5432/resolver
spring.datasource.username=serviceuser
spring.datasource.password=servicepwd

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.driver-class-name=org.postgresql.Driver

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=org.cards.*
spring.kafka.consumer.properties.spring.json.value.default.type=org.cards.resolver.dtos.RoundDTO