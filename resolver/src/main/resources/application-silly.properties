spring.application.name=resolver
server.port = 8106


#spring.datasource.url=jdbc:postgresql://localhost:543S/resolver

spring.datasource.url=jdbc:postgresql://postgres_resolver:5432/resolver
spring.datasource.username=serviceuser
spring.datasource.password=servicepwd

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.datasource.driver-class-name=org.postgresql.Driver

# Kafka
spring.kafka.bootstrap-servers=kafka:9093
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=org.cards.*
spring.kafka.consumer.properties.spring.json.value.default.type=org.cards.resolver.dtos.RoundDTO

spring.cloud.consul.discovery.enable-tag-override=true
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.include-hostname-in-instance-id=true
spring.cloud.consul.discovery.instance-id=${spring.application.name}-${random.value}

