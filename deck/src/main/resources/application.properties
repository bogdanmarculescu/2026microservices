spring.application.name=deck

server.port = 8001

spring.config.import=optional:consul:
spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.cloud.consul.config.format=YAML

spring.datasource.url=jdbc:postgresql://localhost:5432/deck

# spring.datasource.url=jdbc:postgresql://postgres:5432/deck
spring.datasource.username=serviceuser
spring.datasource.password=servicepwd

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.driver-class-name=org.postgresql.Driver

logging.level.root=INFO

# Use one JSON object per console log event
logging.structured.format.console=ecs

# Identify the application
logging.structured.ecs.service.name=${spring.application.name}

# Useful for a classroom demo
logging.level.org.cards=INFO

management.endpoints.web.exposure.include=health,info