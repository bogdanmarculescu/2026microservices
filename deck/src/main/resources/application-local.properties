spring.application.name=deck

server.port = 8001

spring.datasource.url=jdbc:postgresql://localhost:5432/deck

# spring.datasource.url=jdbc:postgresql://postgres:5432/deck
spring.datasource.username=serviceuser
spring.datasource.password=servicepwd

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.driver-class-name=org.postgresql.Driver
